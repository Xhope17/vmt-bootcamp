<h2 mat-dialog-title class="font-bold text-center">{{ data.title }}</h2>

<mat-dialog-content>
  @if (data.component) {
    <ng-container *ngComponentOutlet="data.component"></ng-container>
  }
   <!-- @else if (data.message) {
    <div class="py-2">
      <p class="text-gray-300 text-lg">{{ data.message }}</p>

      @if (data.subMessage) {
        <p class="text-red-400 text-sm mt-1">{{ data.subMessage }}</p>
      }
    </div>
  } -->
  <!-- {{ data.action }} -->
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-4 pr-4">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSaveClick()">
    {{ data.btnText || 'Guardar' }}
  </button>
</mat-dialog-actions>
