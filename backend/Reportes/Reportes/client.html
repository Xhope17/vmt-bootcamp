<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.8/signalr.signalr.min.js"></script>
  </head>
  <body>
    <div id="order"></div>

    <button id="generateReport">Crear reporte</button>

    <script>
      const BASE_URL = "http://localhost:5174"; //cambiar
      const generateReport = document.getElementById("generateReport");

      generateReport.addEventListener("click", async () => {
        try {
          const response = await fetch(`${BASE_URL}/reportes/crear`, {
            method: "POST",
            body: JSON.stringify({
              name: "Mi reporte",
              Type: "ventas",
              // Aquí puedes incluir los datos necesarios para generar el reporte
            }),
            headers: {
              "Content-Type": "application/json",
            },
          });

          if (response.ok) {
            const result = await response.json();
            console.log("Reporte generado:", result);
          } else {
            console.error("Error al generar el reporte:", response.statusText);
          }
        } catch (error) {
          console.error("Error de red:", error);
        }
      })(async () => {
        const connection = new signalR.HubConnectionBuilder()
          .withUrl("http://localhost:5174/hub/order") //cambiar
          .withAutomaticReconnect()
          .Build();
        await connection.start();

        (connection.on("OrderStatusUpdate"),
          (data) => {
            console.log(data);
          });
      });
    </script>
  </body>
</html>
